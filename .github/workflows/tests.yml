name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      # Checking out a public repository is all this job needs.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor and the lab VM's version, so it is not optional:
        # a 3.12-only construct once passed the whole suite on a 3.12 box and
        # broke on import on 3.11 (docs/limitations.md L20).
        python-version: ["3.11", "3.12"]

    steps:
      # Pinned to a commit, not a tag: a tag can be moved to point at different
      # code, and these steps run with repository contents in scope.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        # ubuntu-latest has a live /proc, so the needs_procfs integration tier
        # runs here rather than skipping as it does on a non-Linux workstation.
        run: pytest tests -q
