name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      # Checking out a public repository is all this job needs.
      contents: read

    steps:
      # Pinned to a commit, not a tag: a tag can be moved to point at different
      # code, and these steps run with repository contents in scope.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install
        # Pinned: the rule set lives in pyproject.toml, but a ruff release can
        # still change what a rule flags and turn a clean tree red.
        run: pip install ruff==0.16.7

      - name: Ruff
        run: ruff check .
