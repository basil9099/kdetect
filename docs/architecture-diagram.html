  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  <div class="frame">
    <p class="eyebrow">Architecture · kdetect</p>
    <h1>kdetect architecture</h1>
    <p class="standfirst">A kernel rootkit&rsquo;s job is to lie to userspace, so kdetect asks the same
      question through channels of differing trustworthiness and compares the answers. Two pure pipelines
      sit above one impure layer.</p>

    <svg viewBox="0 0 960 1060" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kdetect-arch-title kdetect-arch-desc">
      <title id="kdetect-arch-title">kdetect architecture</title>
      <desc id="kdetect-arch-desc">Kernel surfaces feed a Source layer — the only part of kdetect that performs I/O, and the seam where a live reader is swapped for a fixture reader. Below it, pure parsers and collectors assemble a JSON snapshot, which analysis reads alongside an optional signed baseline: detectors emit signals, scoring composes one finding per suspect, and a reporting layer renders findings and IOCs as Markdown or JSON.</desc>

        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#6b3fa0"/>
        </marker>
      </defs>

      <text x="72" y="677" fill="rgba(20,24,31,0.40)" font-size="8"
